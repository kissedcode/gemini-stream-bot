# Local development: docker compose up --build  (production uses deploy/docker-compose.yml)
services:
  bot:
    image: gemini-stream-bot:local
    build: .
    container_name: gemini-stream-bot-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Luxembourg}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
