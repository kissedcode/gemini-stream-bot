services:
  bot:
    image: gemini-stream-bot:local
    build: .
    container_name: gemini-stream-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Luxembourg}
    # leave time to finalize in-flight answers on SIGTERM
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
