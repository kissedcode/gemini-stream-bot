name: CI/CD

on:
  pull_request:          # never pull_request_target: fork PRs must not see secrets
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kissedcode/gemini-stream-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # secrets live here; environment is limited to the main branch
    permissions:
      contents: read
      packages: read
    env:
      DIR: /opt/gemini-stream-bot
    steps:
      - name: Check secrets
        id: check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USERNAMES: ${{ secrets.ALLOWED_USERNAMES }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          missing=""
          for v in BOT_TOKEN GEMINI_API_KEY ALLOWED_USERNAMES DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY DROPLET_KNOWN_HOSTS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::deploy skipped, secrets not set in environment 'production':$missing (run scripts/setup-github-secrets.sh)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Configure SSH
        if: steps.check.outputs.ready == 'true'
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Write .env and compose on the droplet
        if: steps.check.outputs.ready == 'true'
        env:
          TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USERNAMES: ${{ secrets.ALLOWED_USERNAMES }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_SYSTEM_PROMPT: ${{ vars.GEMINI_SYSTEM_PROMPT }}
        run: |
          ssh "$TARGET" "mkdir -p $DIR"
          scp deploy/docker-compose.yml "$TARGET:$DIR/docker-compose.yml"
          {
            echo "IMAGE_TAG=${GITHUB_SHA}"
            echo "BOT_TOKEN=${BOT_TOKEN}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "GEMINI_MODEL=${GEMINI_MODEL}"
            echo "GEMINI_SYSTEM_PROMPT=${GEMINI_SYSTEM_PROMPT}"
            echo "GEMINI_TIMEOUT_SEC=120"
            echo "ALLOWED_USERNAMES=${ALLOWED_USERNAMES}"
            echo "RATE_LIMIT_PER_MINUTE=20"
            echo "DRAFT_INTERVAL_MS=300"
            echo "TZ=Europe/Luxembourg"
            echo "LOG_LEVEL=INFO"
          } | ssh "$TARGET" "umask 077 && cat > $DIR/.env.new && mv $DIR/.env.new $DIR/.env"

      - name: Pull and restart
        if: steps.check.outputs.ready == 'true'
        env:
          TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # short-lived GITHUB_TOKEN: login, pull, logout — no registry credentials stay on the droplet
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "cd $DIR \
            && docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null \
            && docker compose pull; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
          ssh "$TARGET" "cd $DIR && docker compose up -d --remove-orphans && sleep 8 \
            && docker compose ps && docker compose logs --tail=30 \
            && docker compose logs | grep -q 'Application started' \
            && docker image prune -f >/dev/null"
